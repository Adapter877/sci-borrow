version: '3.7'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    restart: always
    depends_on:
      - mysql

  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: borrow
      MYSQL_USER: sak
      MYSQL_PASSWORD: ***REDACTED***
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
